# Site settings
title: "The CMP Branch — RISC OS News"
description: "Community news and updates from the RISC OS world"
url: "https://the-cmp-branch.github.io"
baseurl: "/News"
goatcounter: "https://the-cmp-branch.goatcounter.com/count"

# Seasonal decorations — set to a season id (e.g. "christmas") to force it on;
# clear to "" so production uses the calendar windows in _data/seasons.yml.
season_override: ""

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
paginate: 24
paginate_path: "/page/:num/"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Exclude files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - CONTRIBUTING.md
  - vendor/
  - README.md
  - screenshots/
  - assets/*.old
  - assets/logo-reference.jpg
  - assets/logo-approved.jpg

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
