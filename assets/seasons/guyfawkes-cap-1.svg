<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 36" fill="none" aria-hidden="true">
  <!-- London cityscape resting on the card -->
  <g fill="#1B365D">
    <!-- left terrace -->
    <rect x="0" y="22" width="48" height="14"/>
    <rect x="4" y="18" width="3" height="5"/>
    <rect x="12" y="18" width="3" height="5"/>
    <rect x="20" y="18" width="3" height="5"/>
    <rect x="28" y="18" width="3" height="5"/>
    <rect x="36" y="18" width="3" height="5"/>
    <!-- Victoria Tower -->
    <rect x="52" y="8" width="16" height="28"/>
    <rect x="50" y="4" width="20" height="5"/>
    <polygon points="60,0 50,4 70,4"/>
    <!-- halls -->
    <rect x="72" y="20" width="70" height="16"/>
    <rect x="76" y="15" width="4" height="6"/>
    <rect x="86" y="15" width="4" height="6"/>
    <rect x="96" y="15" width="4" height="6"/>
    <rect x="106" y="15" width="4" height="6"/>
    <rect x="116" y="15" width="4" height="6"/>
    <rect x="126" y="15" width="4" height="6"/>
    <!-- Big Ben -->
    <rect x="150" y="4" width="14" height="32"/>
    <rect x="147" y="1" width="20" height="5"/>
    <rect x="152" y="-6" width="10" height="9"/>
    <polygon points="157,-10 150,-6 164,-6"/>
    <!-- right halls -->
    <rect x="170" y="18" width="80" height="18"/>
    <rect x="176" y="13" width="4" height="6"/>
    <rect x="188" y="13" width="4" height="6"/>
    <rect x="200" y="13" width="4" height="6"/>
    <rect x="212" y="13" width="4" height="6"/>
    <rect x="224" y="13" width="4" height="6"/>
    <rect x="236" y="13" width="4" height="6"/>
    <!-- mid tower -->
    <rect x="258" y="10" width="12" height="26"/>
    <rect x="256" y="7" width="16" height="4"/>
    <polygon points="264,2 256,7 272,7"/>
    <!-- far terrace -->
    <rect x="278" y="20" width="70" height="16"/>
    <rect x="284" y="15" width="3" height="5"/>
    <rect x="294" y="15" width="3" height="5"/>
    <rect x="304" y="15" width="3" height="5"/>
    <rect x="314" y="15" width="3" height="5"/>
    <rect x="324" y="15" width="3" height="5"/>
    <rect x="334" y="15" width="3" height="5"/>
    <!-- end tower -->
    <rect x="356" y="8" width="14" height="28"/>
    <rect x="354" y="5" width="18" height="4"/>
    <polygon points="363,0 354,5 372,5"/>
    <rect x="374" y="22" width="26" height="14"/>
  </g>
  <!-- clock faces -->
  <circle cx="157" cy="14" r="3.2" fill="#d4a574"/>
  <circle cx="157" cy="14" r="1.8" fill="#1B365D"/>
  <!-- river hint under skyline -->
  <path d="M0 34 H400" stroke="#3a5a7a" stroke-width="1.5" opacity="0.45"/>
  <!-- a couple of barrels in front -->
  <g transform="translate(100,24)">
    <ellipse cx="0" cy="2" rx="7" ry="2" fill="#6b4423"/>
    <rect x="-7" y="2" width="14" height="8" fill="#8a5a2b"/>
    <ellipse cx="0" cy="10" rx="7" ry="2" fill="#5c3a28"/>
    <rect x="-7" y="4" width="14" height="1.5" fill="#c45c26"/>
  </g>
  <g transform="translate(300,24)">
    <ellipse cx="0" cy="2" rx="7" ry="2" fill="#6b4423"/>
    <rect x="-7" y="2" width="14" height="8" fill="#8a5a2b"/>
    <ellipse cx="0" cy="10" rx="7" ry="2" fill="#5c3a28"/>
    <rect x="-7" y="4" width="14" height="1.5" fill="#c45c26"/>
  </g>
</svg>
