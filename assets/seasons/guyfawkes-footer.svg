<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" aria-hidden="true">
  <!-- Stack of gunpowder barrels -->
  <g transform="translate(55,28)">
    <g transform="translate(-16,14)">
      <ellipse cx="0" cy="4" rx="12" ry="3.5" fill="#6b4423"/>
      <rect x="-12" y="4" width="24" height="16" fill="#8a5a2b"/>
      <ellipse cx="0" cy="20" rx="12" ry="3.5" fill="#5c3a28"/>
      <rect x="-12" y="8" width="24" height="2.5" fill="#c45c26"/>
    </g>
    <g transform="translate(16,14)">
      <ellipse cx="0" cy="4" rx="12" ry="3.5" fill="#6b4423"/>
      <rect x="-12" y="4" width="24" height="16" fill="#8a5a2b"/>
      <ellipse cx="0" cy="20" rx="12" ry="3.5" fill="#5c3a28"/>
      <rect x="-12" y="8" width="24" height="2.5" fill="#c45c26"/>
    </g>
    <g transform="translate(0,0)">
      <ellipse cx="0" cy="4" rx="12" ry="3.5" fill="#6b4423"/>
      <rect x="-12" y="4" width="24" height="16" fill="#8a5a2b"/>
      <ellipse cx="0" cy="20" rx="12" ry="3.5" fill="#5c3a28"/>
      <rect x="-12" y="8" width="24" height="2.5" fill="#c45c26"/>
      <text x="0" y="16" text-anchor="middle" font-size="6" font-family="Georgia, serif" fill="#3a2a20" font-weight="700">POWDER</text>
    </g>
  </g>

  <!-- Houses of Parliament skyline -->
  <g transform="translate(175,16)" fill="#1B365D">
    <!-- Victoria Tower-ish -->
    <rect x="-70" y="18" width="14" height="30"/>
    <rect x="-72" y="14" width="18" height="5"/>
    <polygon points="-63,6 -72,14 -54,14"/>
    <!-- central halls -->
    <rect x="-50" y="28" width="40" height="20"/>
    <rect x="-48" y="24" width="4" height="6"/>
    <rect x="-40" y="24" width="4" height="6"/>
    <rect x="-32" y="24" width="4" height="6"/>
    <rect x="-24" y="24" width="4" height="6"/>
    <rect x="-16" y="24" width="4" height="6"/>
    <!-- Big Ben -->
    <rect x="0" y="8" width="12" height="40"/>
    <rect x="-2" y="4" width="16" height="6"/>
    <rect x="2" y="-6" width="8" height="12"/>
    <polygon points="6,-12 0,-6 12,-6"/>
    <circle cx="6" cy="18" r="3.5" fill="#d4a574"/>
    <circle cx="6" cy="18" r="2" fill="#1B365D"/>
    <!-- right wing -->
    <rect x="18" y="28" width="36" height="20"/>
    <rect x="20" y="24" width="4" height="6"/>
    <rect x="28" y="24" width="4" height="6"/>
    <rect x="36" y="24" width="4" height="6"/>
    <rect x="44" y="24" width="4" height="6"/>
  </g>
</svg>
