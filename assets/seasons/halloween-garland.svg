<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" aria-hidden="true">
  <!-- Cord - seamless -->
  <path d="M0 12 C 50 4, 100 20, 150 12 S 250 4, 300 12"
        stroke="#5b3a8c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M0 16 C 60 24, 110 8, 160 16 S 250 22, 300 16"
        stroke="#2a2a2a" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

  <!-- Strings -->
  <g stroke="#5b3a8c" stroke-width="1.2" stroke-linecap="round">
    <line x1="75" y1="14" x2="75" y2="28"/>
    <line x1="150" y1="13" x2="150" y2="30"/>
    <line x1="225" y1="14" x2="225" y2="26"/>
  </g>

  <!-- Bat -->
  <g transform="translate(75,40)" fill="#2a2a2a">
    <path d="M0 4 C-10 0,-18 -6,-22 -2 C-16 2,-8 6,0 8 C8 6,16 2,22 -2 C18 -6,10 0,0 4z"/>
    <circle cx="0" cy="6" r="3.5"/>
    <path d="M-2 3 L-4 -2 M2 3 L4 -2" stroke="#2a2a2a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Pumpkin -->
  <g transform="translate(150,46)">
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="#e67a00"/>
    <ellipse cx="-5" cy="0" rx="5" ry="11" fill="#f08920" opacity="0.7"/>
    <ellipse cx="5" cy="0" rx="5" ry="11" fill="#d35400" opacity="0.55"/>
    <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#3d9a5f"/>
    <path d="M-5 -2 L-2 2 L0 -1 L2 2 L5 -2" fill="#2a2a2a"/>
  </g>

  <!-- Ghost -->
  <g transform="translate(225,38)">
    <path d="M-10 4 C-10 -8,10 -8,10 4 L10 20 L5 16 L0 20 L-5 16 L-10 20 Z" fill="#f5f0e6"/>
    <circle cx="-4" cy="2" r="2" fill="#2a2a2a"/>
    <circle cx="4" cy="2" r="2" fill="#2a2a2a"/>
  </g>
</svg>
