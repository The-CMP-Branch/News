<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ site.description }}{% endif %}">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header>
        <div class="container">
            <div class="site-header-content">
                <a href="{{ '/' | relative_url }}" class="logo-link">
                    <picture class="site-logo-full">
                        <source srcset="{{ '/assets/logo-full@2x.webp' | relative_url }}" type="image/webp">
                        <img src="{{ '/assets/logo-full@2x.png' | relative_url }}" alt="The CMP Branch — RISC OS News">
                    </picture>
                    <div class="site-logo-compact">
                        <picture class="site-logo-icon">
                            <source srcset="{{ '/assets/logo-icon@2x.webp' | relative_url }}" type="image/webp">
                            <img src="{{ '/assets/logo-icon@2x.png' | relative_url }}" alt="The CMP Branch">
                        </picture>
                        <span class="site-title-compact">The CMP Branch</span>
                    </div>
                </a>
                <nav>
                    <a href="{{ '/' | relative_url }}">Home</a>
                    <a href="{{ '/about' | relative_url }}">About</a>
                </nav>
            </div>
        </div>
    </header>
    
    <main class="container">
        {{ content }}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} The CMP Branch. Content sources credited per article.</p>
        </div>
    </footer>
</body>
</html>
