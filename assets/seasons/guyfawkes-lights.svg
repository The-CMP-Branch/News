    <g transform="translate(660,14)" fill="#1B365D">
      <rect x="-5" y="8" width="10" height="30"/>
      <rect x="-7" y="4" width="14" height="5"/>
      <rect x="-3" y="-2" width="6" height="8"/>
      <polygon points="0,-8 -4,-2 4,-2"/>
