# Site settings
title: "The CMP Branch — RISC OS News"
description: "Community news and updates from the RISC OS world"
url: "https://the-cmp-branch.github.io"
baseurl: "/News"

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Exclude files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - CONTRIBUTING.md
  - vendor/
  - README.md
  - screenshots/
  - assets/*.old
  - assets/logo-reference.jpg
  - assets/logo-approved.jpg

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
