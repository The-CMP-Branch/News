<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" aria-hidden="true">
  <!-- Spring vine - seamless -->
  <path d="M0 12 C 50 4, 100 20, 150 12 S 250 4, 300 12"
        stroke="#6bbf8a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M0 16 C 60 24, 110 8, 160 16 S 250 22, 300 16"
        stroke="#3d9a5f" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

  <!-- Leaves -->
  <g fill="#3d9a5f">
    <ellipse cx="40" cy="12" rx="10" ry="4.5" transform="rotate(-20 40 12)"/>
    <ellipse cx="170" cy="13" rx="10" ry="4.5" transform="rotate(18 170 13)"/>
  </g>

  <!-- Strings -->
  <g stroke="#6bbf8a" stroke-width="1.2" stroke-linecap="round">
    <line x1="75" y1="14" x2="75" y2="28"/>
    <line x1="150" y1="13" x2="150" y2="30"/>
    <line x1="225" y1="14" x2="225" y2="26"/>
  </g>

  <!-- Hanging eggs -->
  <ellipse cx="75" cy="44" rx="11" ry="14" fill="#f7b5c8"/>
  <path d="M68 40 Q75 36 82 40" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M66 46 H84" stroke="#e85a7a" stroke-width="1.4"/>

  <ellipse cx="150" cy="48" rx="12" ry="15" fill="#b8dff0"/>
  <path d="M142 44 Q150 39 158 44" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.55"/>
  <circle cx="150" cy="50" r="2.2" fill="#5aa0c8"/>
  <circle cx="144" cy="52" r="1.6" fill="#5aa0c8"/>
  <circle cx="156" cy="52" r="1.6" fill="#5aa0c8"/>

  <ellipse cx="225" cy="42" rx="10" ry="13" fill="#f6e28b"/>
  <path d="M218 38 Q225 34 232 38" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.55"/>
  <path d="M217 44 Q225 48 233 44" stroke="#d4a017" stroke-width="1.3" fill="none"/>
</svg>
