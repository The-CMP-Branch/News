<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title>
{%- include seo.html %}
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <header>
        <div class="container">
            <div class="site-header-content">
                <a href="{{ '/' | relative_url }}" class="logo-link">
                    <picture class="site-logo-full">
                        <source type="image/webp"
                                srcset="{{ '/assets/logo-full.webp' | relative_url }} 600w, {{ '/assets/logo-full@2x.webp' | relative_url }} 1200w"
                                sizes="(max-width: 480px) calc(100vw - 40px), (max-width: 1023px) 440px, 600px">
                        <img src="{{ '/assets/logo-full.png' | relative_url }}"
                             srcset="{{ '/assets/logo-full.png' | relative_url }} 600w, {{ '/assets/logo-full@2x.png' | relative_url }} 1200w"
                             sizes="(max-width: 480px) calc(100vw - 40px), (max-width: 1023px) 440px, 600px"
                             width="600" height="152" alt="The CMP Branch — RISC OS News">
                    </picture>
                    <div class="site-logo-compact">
                        <picture class="site-logo-icon">
                            <source srcset="{{ '/assets/logo-icon.webp' | relative_url }}" type="image/webp">
                            <img src="{{ '/assets/logo-icon.png' | relative_url }}" width="57" height="60" loading="lazy" alt="The CMP Branch">
                        </picture>
                        <span class="site-title-compact">The CMP Branch</span>
                    </div>
                </a>
                <nav>
                    <a href="{{ '/' | relative_url }}">Home</a>
                    <a href="{{ '/about' | relative_url }}">About</a>
                    <a href="{{ '/about/#stay-updated' | relative_url }}">Subscribe</a>
                </nav>
            </div>
        </div>
    </header>
    
    <main class="container">
        {{ content }}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} The CMP Branch. Content sources credited per article. <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></p>
        </div>
    </footer>
</body>
</html>
