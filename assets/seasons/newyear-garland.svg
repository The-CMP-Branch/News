<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" aria-hidden="true">
  <!-- Cord — seamless ends -->
  <path d="M0 10 C 50 2, 100 18, 150 10 S 250 2, 300 10"
        stroke="#c9a227" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M0 14 C 60 22, 110 6, 160 14 S 250 20, 300 14"
        stroke="#1B365D" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Small stars on cord -->
  <g fill="#f0d060">
    <path d="M30 10 l1.4 4.2 h4.2 l-3.4 2.4 1.4 4.2-3.6-2.6-3.6 2.6 1.4-4.2-3.4-2.4 h4.2z"/>
    <path d="M160 11 l1.2 3.5 h3.5 l-2.8 2 1.2 3.5-3.1-2.2-3.1 2.2 1.2-3.5-2.8-2 h3.5z"/>
  </g>

  <!-- Strings -->
  <g stroke="#c9a227" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <line x1="75" y1="12" x2="75" y2="28"/>
    <line x1="150" y1="11" x2="150" y2="30"/>
    <line x1="225" y1="12" x2="225" y2="26"/>
  </g>

  <!-- Hanging ornaments -->
  <path d="M75 34 l4 12 h13 l-10 7 4 12-11-8-11 8 4-12-10-7 h13z" fill="#f0d060" stroke="#c9a227" stroke-width="0.8"/>

  <circle cx="150" cy="48" r="14" fill="#1B365D" stroke="#f0d060" stroke-width="2"/>
  <path d="M150 38 l2.8 8.4 h8.8 l-7.1 5.1 2.8 8.4-7.3-5.3-7.3 5.3 2.8-8.4-7.1-5.1 h8.8z" fill="#f0d060"/>

  <circle cx="225" cy="42" r="11" fill="#c9a227" stroke="#f0d060" stroke-width="1.5"/>
  <circle cx="225" cy="42" r="5" fill="#1B365D"/>

  <g fill="#fff8dc" opacity="0.9">
    <circle cx="50" cy="20" r="1.4"/>
    <circle cx="190" cy="18" r="1.2"/>
    <circle cx="270" cy="21" r="1.3"/>
  </g>
</svg>
