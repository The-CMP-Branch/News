      <rect x="-3" y="-2" width="6" height="8"/>
      <polygon points="0,-8 -4,-2 4,-2"/>
      <circle cx="0" cy="16" r="2.8" fill="#d4a574"/>
      <rect x="-20" y="26" width="12" height="12"/>
