<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ site.description }}{% endif %}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header>
        <div class="container">
            <div class="site-header-content">
                <a href="{{ '/' | relative_url }}" class="logo-link">
                    <img src="{{ '/assets/logo-full.svg' | relative_url }}" alt="The CMP Branch" class="site-logo">
                </a>
                <div class="site-title-area">
                    <p class="tagline">{{ site.description }}</p>
                </div>
            </div>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/about' | relative_url }}">About</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        {{ content }}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} The CMP Branch. Content sources credited per article.</p>
        </div>
    </footer>
</body>
</html>
