# Seasonal decorations — first matching window wins.
# Annual windows use MM-DD. If start > end, the window crosses New Year
# (e.g. 12-27 → 01-03).
# Movable feasts use `windows` with full YYYY-MM-DD ranges.
# Optional header/news/footer asset names under assets/seasons/;
# any omitted placement falls back to "{id}-garland.svg".
- id: christmas
  start: "12-01"
  end: "12-26"
  header: "christmas-garland.svg"
  news: "christmas-lights.svg"
  footer: "christmas-footer.svg"
- id: newyear
  start: "12-27"
  end: "01-03"
  header: "new-year-garland.svg"
  news: "new-year-fireworks.svg"
  footer: "new-year-footer.svg"
- id: valentines
  start: "02-10"
  end: "02-14"
  header: "valentines-garland.svg"
  news: "valentines-lights.svg"
  footer: "valentines-footer.svg"
# Patron saints — flora & creatures only (no national flags / crosses / saltires)
- id: stdavid
  start: "02-28"
  end: "03-02"
  header: "st-david-header-footer-tile.svg"
  news: "st-david-news-strip.svg"
  footer: "st-david-header-footer-tile.svg"
- id: stpatrick
  start: "03-15"
  end: "03-17"
  header: "st-patrick-footer-tile.svg"
  news: "st-patrick-news-strip.svg"
  footer: "st-patrick-footer-tile.svg"
- id: easter
  header: "easter-garland.svg"
  news: "easter-lights.svg"
  footer: "easter-footer.svg"
  windows:
    - { start: "2026-04-01", end: "2026-04-08" }  # Easter 2026-04-05
    - { start: "2027-03-24", end: "2027-03-31" }  # Easter 2027-03-28
    - { start: "2028-04-12", end: "2028-04-19" }  # Easter 2028-04-16
    - { start: "2029-03-28", end: "2029-04-04" }  # Easter 2029-04-01
    - { start: "2030-04-17", end: "2030-04-24" }  # Easter 2030-04-21
    - { start: "2031-04-09", end: "2031-04-16" }  # Easter 2031-04-13
    - { start: "2032-03-24", end: "2032-03-31" }  # Easter 2032-03-28
    - { start: "2033-04-13", end: "2033-04-20" }  # Easter 2033-04-17
    - { start: "2034-04-05", end: "2034-04-12" }  # Easter 2034-04-09
    - { start: "2035-03-21", end: "2035-03-28" }  # Easter 2035-03-25
# After Easter so Easter wins on rare April overlap years (e.g. 2030)
- id: stgeorge
  start: "04-22"
  end: "04-24"
  header: "st-george-footer-tile.svg"
  news: "st-george-news-strip.svg"
  footer: "st-george-footer-tile.svg"
