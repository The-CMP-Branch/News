<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CMP Branch — RISC OS News</title>
    <meta name="description" content="Community news and updates from the RISC OS world">
    <link rel="icon" type="image/png" href="/News/assets/favicon.png">
    <link rel="icon" type="image/x-icon" href="/News/assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/News/assets/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="site-header-content">
                <a href="/News/" class="logo-link">
                    <picture class="site-logo-full">
                        <source srcset="/News/assets/logo-full.webp 1x, /News/assets/logo-full@2x.webp 2x" type="image/webp">
                        <img src="/News/assets/logo-full.png" srcset="/News/assets/logo-full@2x.png 2x" alt="The CMP Branch — RISC OS News">
                    </picture>
                    <div class="site-logo-compact">
                        <picture class="site-logo-icon">
                            <source srcset="/News/assets/logo-icon.webp 1x, /News/assets/logo-icon@2x.webp 2x" type="image/webp">
                            <img src="/News/assets/logo-icon.png" srcset="/News/assets/logo-icon@2x.png 2x" alt="The CMP Branch">
                        </picture>
                        <span class="site-title-compact">The CMP Branch</span>
                    </div>
                </a>
                <nav>
                    <a href="/News/">Home</a>
                    <a href="/News/about">About</a>
                </nav>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="news-list">
            <article class="news-item">
                <div class="news-item-header">
                    <div class="news-item-dots">
                        <span class="window-dot dot-green"></span>
                        <span class="window-dot dot-navy"></span>
                        <span class="window-dot dot-grey"></span>
                    </div>
                </div>
                <div class="news-item-content">
                    <h2><a href="#">Sample News Article</a></h2>
                    <div class="post-meta">
                        <time datetime="2026-11-01">November 1, 2026</time>
                        <div class="tags">
                            <span class="tag">RISC OS</span>
                            <span class="tag">Software</span>
                        </div>
                    </div>
                    <p class="summary">This is a sample news article to test the header layout at different screen sizes.</p>
                    <a href="#" class="read-more">Read more →</a>
                </div>
            </article>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2026 The CMP Branch. Content sources credited per article.</p>
        </div>
    </footer>
</body>
</html>
