<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">
  <!-- Icon: Desktop window with mouse -->
  <g id="icon">
    <!-- Window background -->
    <rect x="75" y="175" width="207" height="210" rx="20" fill="#E8E8E8"/>
    
    <!-- Title bar -->
    <rect x="75" y="175" width="207" height="38" rx="20" fill="#F5EFE0"/>
    <rect x="75" y="193" width="207" height="20" fill="#F5EFE0"/>
    
    <!-- Window dots -->
    <circle cx="101" cy="194" r="9" fill="#00A651"/>
    <circle cx="130" cy="194" r="9" fill="#1B365D"/>
    <circle cx="159" cy="194" r="9" fill="#B0B0B0"/>
    
    <!-- Mouse shape -->
    <ellipse cx="178.5" cy="285" rx="52" ry="65" fill="#1B365D"/>
    
    <!-- Mouse eyes -->
    <circle cx="163" cy="275" r="6" fill="#00A651"/>
    <circle cx="194" cy="275" r="6" fill="#00A651"/>
  </g>
  
  <!-- Text: "The CMP Branch" -->
  <g id="wordmark">
    <text x="320" y="280" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="110" font-weight="700" fill="#1B365D">The CMP</text>
    <text x="700" y="280" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="110" font-weight="700" fill="#00A651">Branch</text>
    
    <!-- Underlines -->
    <line x1="320" y1="310" x2="450" y2="310" stroke="#1B365D" stroke-width="3"/>
    <line x1="820" y1="310" x2="950" y2="310" stroke="#1B365D" stroke-width="3"/>
    
    <!-- Subtitle: "RISC OS News" -->
    <text x="475" y="355" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="400" fill="#1B365D">RISC OS News</text>
  </g>
</svg>
