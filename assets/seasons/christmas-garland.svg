<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" aria-hidden="true">
  <!-- Twine — ends meet for seamless repeat -->
  <path d="M0 10 C 50 2, 100 18, 150 10 S 250 2, 300 10"
        stroke="#2d6a3e" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 14 C 60 22, 110 6, 160 14 S 250 20, 300 14"
        stroke="#1e8f45" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Holly -->
  <g fill="#1e8f45">
    <ellipse cx="30" cy="12" rx="14" ry="6" transform="rotate(-25 30 12)"/>
    <ellipse cx="42" cy="10" rx="12" ry="5" transform="rotate(20 42 10)"/>
    <ellipse cx="160" cy="11" rx="13" ry="5.5" transform="rotate(-18 160 11)"/>
    <ellipse cx="172" cy="13" rx="11" ry="5" transform="rotate(22 172 13)"/>
  </g>
  <g fill="#c41e3a">
    <circle cx="36" cy="14" r="2.5"/><circle cx="42" cy="16" r="2.2"/>
    <circle cx="166" cy="15" r="2.4"/><circle cx="172" cy="17" r="2.1"/>
  </g>

  <!-- Strings -->
  <g stroke="#8b7355" stroke-width="1.2" stroke-linecap="round">
    <line x1="75" y1="12" x2="75" y2="28"/>
    <line x1="150" y1="11" x2="150" y2="30"/>
    <line x1="225" y1="12" x2="225" y2="26"/>
  </g>

  <!-- Caps -->
  <g fill="#c9a227">
    <rect x="69" y="26" width="12" height="4" rx="1"/>
    <rect x="144" y="28" width="12" height="4" rx="1"/>
    <rect x="219" y="24" width="12" height="4" rx="1"/>
  </g>

  <!-- Baubles -->
  <circle cx="75" cy="44" r="12" fill="#c41e3a"/>
  <circle cx="71" cy="40" r="3.5" fill="#fff" opacity="0.35"/>
  <path d="M69 44 H81" stroke="#f0d060" stroke-width="1.5"/>
  <path d="M75 38 V50" stroke="#f0d060" stroke-width="1.5"/>

  <circle cx="150" cy="48" r="14" fill="#1e8f45"/>
  <circle cx="145" cy="43" r="4" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="48" r="7" fill="none" stroke="#f0d060" stroke-width="1.5"/>

  <circle cx="225" cy="42" r="11" fill="#1B365D"/>
  <circle cx="221" cy="38" r="3" fill="#fff" opacity="0.35"/>
  <path d="M218 42 Q225 36 232 42 Q225 48 218 42" fill="#c41e3a"/>
</svg>
