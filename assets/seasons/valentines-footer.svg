<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" aria-hidden="true">
  <!-- Ribbon - seamless -->
  <path d="M0 30 C 50 22, 100 38, 150 28 S 250 22, 300 30"
        stroke="#e85a7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 34 C 60 42, 110 24, 160 36 S 250 40, 300 34"
        stroke="#c41e3a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Rose bloom -->
  <g transform="translate(45,22)">
    <circle cx="0" cy="8" r="10" fill="#c41e3a"/>
    <circle cx="-4" cy="5" r="5" fill="#e85a7a"/>
    <circle cx="4" cy="6" r="4.5" fill="#9b1b30"/>
    <circle cx="0" cy="10" r="3.5" fill="#f4a6b8"/>
    <path d="M0 18 L-2 32 M0 18 L3 30" stroke="#1e8f45" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bow -->
  <g transform="translate(150,24)">
    <path d="M0 12 C-18 0,-22 18,-8 18 C-14 8,-6 4,0 12 C6 4,14 8,8 18 C22 18,18 0,0 12z" fill="#c41e3a"/>
    <circle cx="0" cy="12" r="4" fill="#9b1b30"/>
    <path d="M-2 16 L-4 36 M2 16 L4 36" stroke="#c41e3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Small heart cluster -->
  <g transform="translate(240,26)">
    <path d="M-6 6 C-6 2,-2 0,0 3 C2 0,6 2,6 6 C6 12,0 18,0 18 C0 18,-6 12,-6 6z" fill="#e85a7a"/>
    <path d="M10 10 C10 7,13 5,15 7 C17 5,20 7,20 10 C20 14,15 18,15 18 C15 18,10 14,10 10z" fill="#c41e3a"/>
  </g>
</svg>
